[package]
name = "archaeocad"
version = "0.1.0"
description = "Visor, editor y vectorizador de planos arqueológicos"
authors = ["José Javier Martínez García"]
license = "GPL-3.0-or-later"
repository = "https://github.com/JJ-Martinez-Garcia/ArchaeoCAD"
edition = "2021"

[lib]
name = "archaeocad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
